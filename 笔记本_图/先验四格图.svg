<text x="150" y="994" font-size="13" fill="#333">第三根轴（不画入）：本质必然 / 事实必然——Tengelyi 2014；胡塞尔 1931，Hua XV 385 f.：“一切本质必然性都是它的事实的环节”。</text>
<text x="150" y="1018" font-size="13" fill="#333">本研究的论点：胡塞尔对身体的使用在先验与经验之间摇摆。四格用于诊断：同一身体功能在 A、C、D 之间未加标明的移动（见第 2、6 条）。</text>
