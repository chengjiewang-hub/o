<text transform="translate(1117,540) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">自我客体化 D→C：Hua XV 300（1931）·《危机》§54 · Jacobs 2014</text>
<line x1="1164" y1="220" x2="1164" y2="890" stroke="#555" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ah)"/>
<text transform="translate(1155,540) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">C→D：Hua XXXVI（1914–21）有身体的主体</text>
